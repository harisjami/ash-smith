<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M11 1.5h2l.9 9.5h3.1v2h-3.3L12.9 22.5h-1.8L10.3 13H7v-2h3.1L11 1.5z' fill='%2318181b'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181b" />
    <title>Forge Of Ash — Hand-Forged Blades & Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <style>
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!--
        Pure-CSS boot splash: needs zero JavaScript, so it can never hang.
        React's render() replaces #root's contents the moment the app mounts,
        making this disappear instantly. If it ever stays, the hint below
        explains the only remaining cause (unbuilt source was deployed).
      -->
      <div id="boot" style="position: fixed; inset: 0; z-index: 999; display: grid; place-items: center; background: #f6f7fb">
        <div style="display: flex; flex-direction: column; align-items: center">
          <div style="position: relative; width: 64px; height: 64px">
            <div
              style="
                position: absolute;
                inset: -7px;
                border-radius: 22px;
                border: 2px solid transparent;
                border-top-color: #f59e0b;
                border-right-color: rgba(245, 158, 11, 0.35);
                animation: bootspin 0.75s linear infinite;
              "
            ></div>
            <div
              style="
                width: 64px;
                height: 64px;
                border-radius: 18px;
                background: #18181b;
                display: grid;
                place-items: center;
                box-shadow: 0 12px 30px rgba(24, 24, 27, 0.3);
              "
            >
              <img src="images/logo.png" alt="Forge Of Ash" style="width: 54px; height: 54px; object-fit: contain" onerror="this.style.display='none'" />
            </div>
          </div>
          <p style="margin: 18px 0 0; font-family: 'Sora', system-ui, sans-serif; font-size: 9px; font-weight: 800; letter-spacing: 0.35em; text-transform: uppercase; color: #9ca3af">
            Forge Of Ash
          </p>
        </div>
        <p data-hint style="position: absolute; bottom: 16px; left: 24px; right: 24px; text-align: center; font-family: 'Manrope', system-ui, sans-serif; font-size: 9px; font-weight: 600; line-height: 1.6; color: #c2c5cc">
          Still on this screen? The site needs its production build — run <b style="color: #f59e0b">npm run build</b> and deploy the
          <b style="color: #f59e0b">dist/</b> folder (see README).
        </p>
      </div>
    </div>
    <noscript>
      <p style="text-align: center; padding: 40px; font-family: sans-serif; color: #333">
        Forge Of Ash needs JavaScript enabled to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Failsafe: if React never mounts, the boot splash stays. After a few
      // seconds, turn it into an actionable state instead of a stuck screen.
      setTimeout(function () {
        var boot = document.getElementById("boot");
        if (!boot) return; // app mounted — splash already gone
        var hint = boot.querySelector("[data-hint]");
        if (hint) {
          hint.innerHTML =
            'The shop did not start on this host. <b style="color:#f59e0b">Tap anywhere to reload</b>, or make sure you deployed the built <b style="color:#f59e0b">dist/</b> folder (see README).';
        }
        boot.style.cursor = "pointer";
        boot.addEventListener("click", function () {
          window.location.reload();
        });
      }, 6000);
    </script>
  </body>
</html>
